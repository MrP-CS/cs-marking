<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Teacher marking – GCSE Computer Science</title><meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="CS marking">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#16233F">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#EEF2F8;color:#16233F;font:17px/1.45 -apple-system,"Segoe UI",Calibri,Arial,sans-serif;padding:env(safe-area-inset-top) 20px env(safe-area-inset-bottom)}
#optlock{width:min(440px,100%);background:#fff;border:1px solid #D5DCE8;border-radius:18px;padding:30px 28px;box-shadow:0 12px 40px rgba(22,35,63,.10)}
.mk{width:56px;height:56px;border-radius:14px;background:#16233F;display:grid;place-items:center;margin-bottom:14px}
h1{font-size:24px;margin:0 0 4px}p{margin:6px 0 16px;color:#4A5875}label{font-weight:700;display:block;margin-bottom:6px}
input{width:100%;font:inherit;font-size:19px;padding:13px 14px;border:2px solid #B9C3D6;border-radius:12px;outline:none}input:focus{border-color:#16233F}
button{margin-top:14px;width:100%;font:inherit;font-weight:800;font-size:18px;padding:14px;border:0;border-radius:12px;background:#18744A;color:#fff;cursor:pointer}
button:disabled{opacity:.6}.err{color:#B42318;font-weight:700;min-height:1.4em;margin:10px 0 0}.ver{font-size:13px;color:#6B7690;margin-top:16px}
@media (prefers-color-scheme:dark){body{background:#0F1726;color:#E8EDF7}#optlock{background:#17213A;border-color:#2A3757}p,.ver{color:#AEB9D0}input{background:#0F1726;color:#E8EDF7;border-color:#3A4870}}
</style></head><body>
<form id="optlock" autocomplete="off" hidden>
<div class="mk"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FFE14A" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.2 4.2L19 7"/></svg></div>
<h1>Teacher marking</h1><p>GCSE Computer Science · for staff only. Type the teacher passcode from Teacher guide 1 in OneNote. This device remembers it.</p>
<label for="pc">Teacher passcode</label><input id="pc" type="password" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go">
<button id="go" type="submit">Open the marking screen</button><div class="err" id="err" role="alert"></div>
<div class="ver">Version 2026-11-25 12:00 · works offline once opened · <a href="#" id="fu">Force update</a></div></form>
<p id="wait" style="text-align:center">Opening the marking screen…</p>
<script>
(() => {
const ITER = 310000, KEYK = 'opt-site-key', $ = id => document.getElementById(id);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js', {updateViaCache: 'none'}).catch(() => {});
const b64 = a => btoa(String.fromCharCode(...new Uint8Array(a))), unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
let BIN = null;
async function bin(){ if (BIN) return BIN; let r; try { r = await fetch('app.bin', {cache: 'no-cache'}); } catch (e) { r = await fetch('app.bin'); } if (!r.ok) throw Error('The marking screen could not be loaded (' + r.status + '). Open it once while online.'); const b = new Uint8Array(await r.arrayBuffer());
  if (String.fromCharCode(...b.slice(0, 5)) !== 'OPTM1') throw Error('The marking screen could not be loaded. Open it once while online.'); return BIN = {salt: b.slice(5, 21), iv: b.slice(21, 33), ct: b.slice(33)}; }
async function derive(pw, salt){ const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name: 'PBKDF2', hash: 'SHA-256', salt, iterations: ITER}, base, 256)); }
async function open(raw){ const B = await bin(), k = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  const gz = await crypto.subtle.decrypt({name: 'AES-GCM', iv: B.iv}, k, B.ct);
  const html = await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  document.open(); document.write(html); document.close(); }
const form = $('optlock');
$('fu').onclick = async e => { e.preventDefault(); $('fu').textContent = 'Updating…';
  /* ask the offline worker for the newest copy: a new version installs itself; the same version re-downloads every file */
  try { const r = navigator.serviceWorker && await navigator.serviceWorker.getRegistration(); if (r) { await r.update().catch(() => {}); const w = r.installing || r.waiting;
      await Promise.race([w ? new Promise(ok => { if (w.state === 'activated') return ok(); w.addEventListener('statechange', () => { if (w.state === 'activated' || w.state === 'redundant') ok(); }); })
        : r.active ? new Promise(ok => { const ch = new MessageChannel(); ch.port1.onmessage = () => ok(); r.active.postMessage('refresh', [ch.port2]); }) : null, new Promise(ok => setTimeout(ok, 30000))]); } } catch (e2) {}
  location.replace(location.pathname + '?u=' + Date.now()); };
form.onsubmit = async e => { e.preventDefault(); const pw = $('pc').value.trim(); if (!pw) return; $('go').disabled = true; $('err').textContent = '';
  try { const B = await bin(), raw = await derive(pw, B.salt); try { await open(raw); try { localStorage.setItem(KEYK, JSON.stringify({salt: b64(B.salt), k: b64(raw)})); } catch (e3) {} return; }
      catch (e2) { $('err').textContent = 'That passcode is not right. It is in Teacher guide 1 in OneNote.'; } }
  catch (e1) { $('err').textContent = e1.message; } $('go').disabled = false; };
(async () => { let s = null; try { s = JSON.parse(localStorage.getItem(KEYK) || 'null'); } catch (e) {}
  if (s) { try { const B = await bin(); if (b64(B.salt) === s.salt) { await open(unb64(s.k)); return; } } catch (e) {} }
  $('wait').hidden = true; form.hidden = false; $('pc').focus(); })();
})();
</script></body></html>
